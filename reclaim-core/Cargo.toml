[package]
name = "reclaim-core"
version = "0.1.0"
edition = "2021"
description = "Risk-aware disk scan + safety-gated reclaim engine for Reclaim. The single source of truth."
license = "MIT"

[lib]
name = "reclaim_core"
path = "src/lib.rs"

[[bin]]
name = "reclaim"
path = "src/bin/reclaim.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.8"
trash = "5"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
